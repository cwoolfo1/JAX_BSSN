[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "JAX_BSSN"
version = "0.0.1"
description = "A 3D BSSN Numerical Relativity code using JAX"
authors = [
    { name = "Christopher Woolford", email = "clwoolford@wisc.edu" }
]
license = { file = "LICENSE" }

dependencies = [
    "PyPIC3D @ git+https://github.com/cwoolfo1/PyPIC3D.git@9124995c8eac57f92957a6a59089d04dac1a3392",
    "jax",
    "jaxlib",
    "numpy",
    "matplotlib",
    "openPMD-api",
    "scipy",
]

[project.optional-dependencies]
demos = [
    "tqdm",
]
test = [
    "pytest",
    "sympy",
]

[tool.setuptools]
packages = [
    "JAX_BSSN",
    "JAX_BSSN.bssn",
    "JAX_BSSN.cartoon",
    "JAX_BSSN.cartoon.axisymmetry",
    "JAX_BSSN.cartoon.spherical_symmetry",
    "JAX_BSSN.diagnostics",
    "JAX_BSSN.EM",
    "JAX_BSSN.EM.first_order",
    "JAX_BSSN.evolution",
    "JAX_BSSN.fmr",
    "JAX_BSSN.utilities",
]
